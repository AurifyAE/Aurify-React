name: Deploy Aurify Admin

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create Environment File
        run: |
          cat > .env << EOF
          REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
          REACT_APP_API_KEY=${{ secrets.REACT_APP_API_KEY }}
          REACT_APP_API=${{ secrets.REACT_APP_API }}
          REACT_APP_SOCKET_SECRET=${{ secrets.REACT_APP_SOCKET_SECRET }}
          REACT_APP_SOCKET_SECRET_KEY=${{ secrets.REACT_APP_SOCKET_SECRET_KEY }}
          REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID=${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID=${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
          REACT_APP_VAPID_KEY=${{ secrets.REACT_APP_VAPID_KEY }}
          EOF

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: CI=false npm run build

      - name: Prepare Deployment Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/html/Aurify_Admin
            sudo rm -rf /var/www/html/Aurify_Admin/*
            sudo chown -R ubuntu:ubuntu /var/www/html/Aurify_Admin

      - name: Upload Build Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/*"
          target: "/var/www/html/Aurify_Admin"
          overwrite: true

      - name: Finalize Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Flatten build folder if SCP creates one
            if [ -d /var/www/html/Aurify_Admin/build ]; then
              mv /var/www/html/Aurify_Admin/build/* /var/www/html/Aurify_Admin/
              rm -rf /var/www/html/Aurify_Admin/build
            fi

            # Verify deployment files exist
            test -f /var/www/html/Aurify_Admin/index.html

            # Verify nginx configuration
            sudo nginx -t

            echo "Deployment completed successfully."